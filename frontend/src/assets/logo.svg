<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>OleaCare - Professional Olive</title>
  
  <!-- Main olive fruit -->
  <ellipse cx="60" cy="68" rx="24" ry="32" fill="#8fca52"/>
  
  <!-- Olive highlight (white gloss on left side) -->
